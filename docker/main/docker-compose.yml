# =============================================================================
# PostgreSQL with pgvector support for Automagik Hive
# =============================================================================

services:
  # PostgreSQL with pgvector extension
  postgres:
    image: agnohq/pgvector:16
    container_name: hive-postgres
    restart: unless-stopped
    ports:
      - "5532:5432"
    env_file:
      - .env
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - ../../data/postgres:/var/lib/postgresql/data
      - ./extract_db_credentials.sh:/extract_db_credentials.sh:ro
    entrypoint: ["/extract_db_credentials.sh", "docker-entrypoint.sh"]
    user: "${POSTGRES_UID:-1000}:${POSTGRES_GID:-1000}"
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
